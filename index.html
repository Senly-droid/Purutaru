<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プルタル（提出版）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏺</text></svg>">
<meta name="description" content="教科書には載っていない、人物のもう一つの顔を検索する世界史学習アプリ">
<style>
  :root{
    --ink:#1c1710; --ground:#f2ecdd; --surface:#fbf7ee; --surface-2:#e9dfc7;
    --bronze:#a06a26; --patina:#3c6a5f; --line:rgba(28,23,16,0.15); --muted:#6a5e49;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; line-height:1.7;}
  header{padding:2rem 1.5rem 0.8rem; text-align:center;}
  h1{font-size:1.8rem; margin:0;}
  p.tagline{color:var(--muted); margin-top:0.5rem;}
  main{max-width:800px; margin:0 auto; padding:1.5rem;}
  .search-row{display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1.2rem; align-items:center;}
  input[type="text"], select, button{
    font-size:0.95rem; padding:0.65rem 1rem; border-radius:6px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  input[type="text"]{flex:1; min-width:180px;}
  button{cursor:pointer;}
  button.primary{background:var(--bronze); color:#fff8ec; border-color:var(--bronze); font-weight:600;}
  .toggle{display:flex; align-items:center; gap:0.5rem; margin-left:auto; font-size:0.85rem; color:var(--muted);}
  .mode-row{display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.8rem;}
  .chip-toggle{
    display:block; margin:0; font-size:0.85rem; color:var(--muted);
    background:transparent; border:1px solid var(--line); border-radius:6px;
    padding:0.5rem 0.9rem; cursor:pointer;
  }
  .chip-toggle:hover{background:var(--surface);}
  .chip-toggle.quiz-start{color:var(--patina); border-color:var(--patina);}
  .chip-toggle.quiz-start:hover{background:var(--surface);}
  .quiz-card{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:1.2rem 1.3rem;}
  .quiz-progress{font-size:0.78rem; color:var(--muted); margin-bottom:0.6rem;}
  .quiz-question-label{font-size:0.78rem; letter-spacing:0.05em; color:var(--patina); margin-bottom:0.4rem;}
  .quiz-question{font-size:1.05rem; margin:0 0 1rem; font-weight:600;}
  .quiz-options{display:grid; grid-template-columns:1fr 1fr; gap:0.6rem;}
  @media (max-width:600px){ .quiz-options{grid-template-columns:1fr;} }
  .quiz-option{
    text-align:left; padding:0.7rem 1rem; border-radius:6px; border:1px solid var(--line);
    background:var(--ground); cursor:pointer; font-size:0.92rem;
  }
  .quiz-option:hover:not(:disabled){background:var(--surface-2);}
  .quiz-option.correct{background:var(--patina); border-color:var(--patina); color:#fff8ec;}
  .quiz-option.wrong{background:#a33; border-color:#a33; color:#fff8ec;}
  .quiz-option:disabled{cursor:default;}
  .quiz-feedback{margin-top:1rem; padding-top:1rem; border-top:1px dashed var(--line); font-size:0.92rem;}
  .quiz-feedback p{margin:0 0 0.6rem;}
  .quiz-actions{display:flex; gap:0.6rem; margin-top:1rem; flex-wrap:wrap;}
  .quiz-result{text-align:center;}
  .quiz-result .score{font-size:2rem; color:var(--bronze); font-weight:700; margin:0.4rem 0 1rem;}
  .chip-row{display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.2rem;}
  .chip-row[hidden]{display:none;}
  .intro{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:1.2rem 1.3rem;}
  .intro h2{font-size:1rem; margin:0 0 0.6rem; color:var(--patina);}
  .intro p{margin:0 0 0.7rem; font-size:0.92rem;}
  .intro p:last-child{margin-bottom:0;}
  .chip{
    font-size:0.85rem; padding:0.4rem 0.9rem; border-radius:99px; border:1px solid var(--line);
    background:var(--surface); cursor:pointer;
  }
  .chip.active{background:var(--bronze); border-color:var(--bronze); color:#fff8ec;}
  .filter-row{display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.8rem;}
  .filter-row[hidden]{display:none;}
  .filter-chip{
    font-size:0.78rem; padding:0.3rem 0.75rem; border-radius:99px; border:1px solid var(--line);
    background:transparent; color:var(--muted); cursor:pointer;
  }
  .filter-chip.active{background:var(--patina); border-color:var(--patina); color:#fff8ec;}
  .filter-chip.fav-filter{margin-left:auto;}
  .chip[hidden]{display:none;}
  .fav-star{
    background:transparent; border:none; cursor:pointer; font-size:1.3rem; line-height:1;
    padding:0.1rem 0.3rem; color:var(--muted); vertical-align:middle;
  }
  .fav-star.active{color:var(--bronze);}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem;}
  .card-head h2{margin:0;}
  .achievement{
    font-size:0.88rem; color:var(--muted); background:var(--surface-2);
    border-radius:8px; padding:0.7rem 1rem; margin-bottom:0.8rem;
  }
  .achievement-label{
    display:block; font-size:0.72rem; letter-spacing:0.05em; color:var(--muted);
    margin-bottom:0.2rem; opacity:0.8;
  }
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
  @media (max-width:600px){ .cards{grid-template-columns:1fr;} }
  .card{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:1.2rem 1.3rem;}
  .card h2{font-size:0.8rem; letter-spacing:0.05em; margin:0 0 0.6rem; color:var(--muted);}
  .card.hidden h2{color:var(--patina);}
  .card p{margin:0; font-size:0.95rem;}
  .meta{font-size:0.8rem; color:var(--muted); margin-top:1rem;}
  .source{font-size:0.75rem; color:var(--muted); margin-top:0.8rem; border-top:1px dashed var(--line); padding-top:0.6rem;}
  .source a{color:var(--muted);}
  .error{color:#a33; margin-top:1rem;}
  .wiki-card{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:1.2rem 1.3rem;}
  .wiki-card h2{font-size:0.8rem; letter-spacing:0.05em; margin:0 0 0.6rem; color:var(--patina);}
  .wiki-card p{margin:0; font-size:0.95rem;}
  .wiki-badge{
    display:inline-block; font-size:0.7rem; background:var(--surface-2); color:var(--muted);
    padding:0.15rem 0.6rem; border-radius:99px; margin-bottom:0.8rem;
  }
  .loading{color:var(--muted); font-size:0.9rem;}
  .suggest-list{
    list-style:none; margin:0; padding:0; position:relative;
  }
  .suggest-list li{
    padding:0.5rem 0.8rem; cursor:pointer; border:1px solid var(--line); border-top:none;
    background:var(--surface); font-size:0.9rem;
  }
  .suggest-list li:hover{background:var(--surface-2);}
  footer{text-align:center; color:var(--muted); font-size:0.75rem; padding:2rem 1rem;}
</style>
</head>
<body>
<header>
  <h1>プルタル</h1>
  <p class="tagline">教科書には載っていない、人物の「もう一つの顔」を。</p>
</header>
<main>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="人物名を入力（例: タレス）" autocomplete="off">
    <button class="primary" id="searchBtn">検索</button>
    <div class="toggle">
      出典:
      <select id="modeSelect">
        <option value="restricted">制限モード</option>
        <option value="expanded">拡張モード</option>
      </select>
    </div>
  </div>
  <ul class="suggest-list" id="suggestList"></ul>

  <div class="mode-row">
    <button class="chip-toggle" id="chipToggle" aria-expanded="false">収録人物の一覧を表示</button>
    <button class="chip-toggle quiz-start" id="quizStartBtn">クイズに挑戦する</button>
  </div>
  <div class="filter-row" id="filterRow" hidden></div>
  <div class="chip-row" id="chipRow" hidden></div>

  <div id="result"></div>
</main>

<script src="data/figures.js"></script>
<script>
(function(){
  const resultEl = document.getElementById("result");
  const chipRow = document.getElementById("chipRow");
  const chipToggle = document.getElementById("chipToggle");
  const filterRow = document.getElementById("filterRow");
  const searchInput = document.getElementById("searchInput");
  const suggestList = document.getElementById("suggestList");
  const modeSelect = document.getElementById("modeSelect");

  // ---- お気に入り機能（このブラウザ内にのみ保存） ----
  const FAV_KEY = "purutaru_favorites";
  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAV_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) {
      return new Set();
    }
  }
  function saveFavorites(set) {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
    } catch (e) {
      // localStorageが使えない環境では保存しない（お気に入りは記憶されないだけ）
    }
  }
  let favorites = loadFavorites();
  function isFavorite(id) {
    return favorites.has(id);
  }
  function toggleFavorite(id) {
    if (favorites.has(id)) {
      favorites.delete(id);
    } else {
      favorites.add(id);
    }
    saveFavorites(favorites);
  }

  let showFavoritesOnly = false;
  let activeGenre = "all";

  chipToggle.addEventListener("click", () => {
    const isHidden = chipRow.hidden;
    chipRow.hidden = !isHidden;
    filterRow.hidden = !isHidden;
    chipToggle.textContent = isHidden ? "収録人物の一覧を隠す" : "収録人物の一覧を表示";
    chipToggle.setAttribute("aria-expanded", String(isHidden));
  });

  // ---- ジャンル絞り込みチップを生成 ----
  const genres = [...new Set(FIGURES.map((f) => f.genre))];
  function buildFilterRow() {
    filterRow.innerHTML = "";
    const allBtn = document.createElement("button");
    allBtn.className = "filter-chip active";
    allBtn.textContent = "すべて";
    allBtn.dataset.genre = "all";
    allBtn.addEventListener("click", () => setGenreFilter("all"));
    filterRow.appendChild(allBtn);

    genres.forEach((g) => {
      const btn = document.createElement("button");
      btn.className = "filter-chip";
      btn.textContent = g;
      btn.dataset.genre = g;
      btn.addEventListener("click", () => setGenreFilter(g));
      filterRow.appendChild(btn);
    });

    const favBtn = document.createElement("button");
    favBtn.className = "filter-chip fav-filter";
    favBtn.textContent = "★ お気に入りのみ";
    favBtn.addEventListener("click", () => {
      showFavoritesOnly = !showFavoritesOnly;
      favBtn.classList.toggle("active", showFavoritesOnly);
      renderChips();
    });
    filterRow.appendChild(favBtn);
  }
  function setGenreFilter(genre) {
    activeGenre = genre;
    filterRow.querySelectorAll(".filter-chip:not(.fav-filter)").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.genre === genre);
    });
    renderChips();
  }
  buildFilterRow();

  // ---- 人物一覧チップを生成（絞り込み条件に応じて表示/非表示） ----
  const chipEls = new Map();
  FIGURES.forEach((fig) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = fig.name;
    chip.dataset.id = fig.id;
    chip.addEventListener("click", () => {
      searchInput.value = fig.name;
      renderFigure(fig.id);
      highlightChip(fig.id);
    });
    chipRow.appendChild(chip);
    chipEls.set(fig.id, chip);
  });

  function renderChips() {
    FIGURES.forEach((fig) => {
      const chip = chipEls.get(fig.id);
      const genreOk = activeGenre === "all" || fig.genre === activeGenre;
      const favOk = !showFavoritesOnly || isFavorite(fig.id);
      chip.hidden = !(genreOk && favOk);
    });
  }
  renderChips();

  function highlightChip(id) {
    chipRow.querySelectorAll(".chip").forEach((c) => {
      c.classList.toggle("active", c.dataset.id === id);
    });
  }

  function findById(id) {
    return FIGURES.find((f) => f.id === id);
  }

  function searchByName(query) {
    const q = query.trim();
    if (!q) return [];
    return FIGURES.filter(
      (f) => f.name.includes(q) || f.name_en.toLowerCase().includes(q.toLowerCase())
    );
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderFigure(id) {
    const fig = findById(id);
    if (!fig) return;
    const mode = modeSelect.value;
    const sourceLabel =
      mode === "expanded"
        ? "拡張モード（提出版では制限モードと同じ内容を表示）"
        : "制限モード（Wikipedia等に限定）";
    const favActive = isFavorite(fig.id);
    const achievementHtml = fig.achievement
      ? `<div class="achievement"><span class="achievement-label">教科書での実績</span>${escapeHtml(fig.achievement)}</div>`
      : "";
    resultEl.innerHTML = `
      ${achievementHtml}
      <div class="card hidden">
        <div class="card-head">
          <h2>もう一つの顔</h2>
          <button class="fav-star${favActive ? " active" : ""}" id="favBtn" title="お気に入りに登録/解除" aria-pressed="${favActive}">${favActive ? "★" : "☆"}</button>
        </div>
        <p>${fig.hidden_face}</p>
      </div>
      <div class="meta">${fig.name}（${fig.name_en}） / ${fig.category}・${fig.genre}</div>
      <div class="source">出典: ${fig.source}　|　${sourceLabel}　|　<a href="${fig.source_url}" target="_blank" rel="noopener">参照元を見る</a></div>
    `;
    document.getElementById("favBtn").addEventListener("click", () => {
      toggleFavorite(fig.id);
      renderFigure(id);
      renderChips();
    });
  }

  // データベース未収録の人物向け：Wikipedia日本語版のREST APIから
  // 記事の要約をその場で取得して表示する（AIによる加工は行わず、原文をそのまま表示）
  async function renderFromWikipedia(query) {
    resultEl.innerHTML = `<p class="loading">Wikipediaで「${escapeHtml(query)}」を検索しています…</p>`;
    try {
      const summaryUrl = `https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
      const res = await fetch(summaryUrl);
      if (!res.ok) {
        throw new Error("not_found");
      }
      const data = await res.json();
      if (data.type === "disambiguation" || !data.extract) {
        throw new Error("no_extract");
      }
      const pageUrl =
        (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) ||
        `https://ja.wikipedia.org/wiki/${encodeURIComponent(query)}`;
      resultEl.innerHTML = `
        <div class="wiki-card">
          <span class="wiki-badge">データベース未収録・Wikipediaから直接取得</span>
          <h2>${escapeHtml(data.title || query)}</h2>
          <p>${escapeHtml(data.extract)}</p>
        </div>
        <div class="source">この内容はWikipedia日本語版から直接取得したものです（「もう一つの顔」への加工はまだ行われていません）。　|　<a href="${pageUrl}" target="_blank" rel="noopener">Wikipediaで読む</a></div>
      `;
    } catch (err) {
      resultEl.innerHTML = `<p class="error">「${escapeHtml(query)}」は提出版の収録データにも、Wikipedia日本語版にも見つかりませんでした。人物名の表記をご確認ください。</p>`;
    }
  }

  function renderSuggestions(query) {
    const matches = searchByName(query);
    suggestList.innerHTML = "";
    if (!query.trim() || matches.length === 0) return;
    matches.slice(0, 6).forEach((f) => {
      const li = document.createElement("li");
      li.textContent = `${f.name}（${f.category}）`;
      li.addEventListener("click", () => {
        searchInput.value = f.name;
        suggestList.innerHTML = "";
        renderFigure(f.id);
        highlightChip(f.id);
      });
      suggestList.appendChild(li);
    });
  }

  function handleSearch() {
    const query = searchInput.value.trim();
    if (!query) return;
    const matches = searchByName(query);
    suggestList.innerHTML = "";
    if (matches.length === 0) {
      highlightChip(null);
      // データベースに無い人物は、Wikipediaからその場で取得を試みる
      renderFromWikipedia(query);
      return;
    }
    renderFigure(matches[0].id);
    highlightChip(matches[0].id);
  }

  document.getElementById("searchBtn").addEventListener("click", handleSearch);
  searchInput.addEventListener("input", () => renderSuggestions(searchInput.value));
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSearch();
  });
  modeSelect.addEventListener("change", () => {
    const active = chipRow.querySelector(".chip.active");
    if (active) renderFigure(active.dataset.id);
  });

  function renderIntro() {
    resultEl.innerHTML = `
      <div class="intro">
        <h2>プルタルとは</h2>
        <p>プルタルは、世界史の授業や教科書には載っていない、人物の「もう一つの顔」を検索できるアプリです。教科書の一行の説明だけでは印象に残りにくい人物も、意外なエピソードを知ることで記憶に残りやすくなります。</p>
        <p>上の検索欄に人物名を入力するか、「収録人物の一覧を表示」から人物を選んで検索してみてください。</p>
      </div>
    `;
  }

  // ---- クイズ機能 ----
  // 教科書に載っている「実績」を問題文にし、人物名を4択で当てるクイズ。
  // 正解すると「もう一つの顔」も続けて表示され、暗記の助けになるようにしている。
  const QUIZ_LENGTH = 8;
  const quizStartBtn = document.getElementById("quizStartBtn");
  let quizState = null;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuizQuestions() {
    const pool = FIGURES.filter((f) => f.achievement);
    const chosen = shuffle(pool).slice(0, Math.min(QUIZ_LENGTH, pool.length));
    return chosen.map((fig) => {
      const distractors = shuffle(pool.filter((f) => f.id !== fig.id)).slice(0, 3);
      const options = shuffle([fig, ...distractors]);
      return { fig, options };
    });
  }

  function startQuiz() {
    quizState = {
      questions: buildQuizQuestions(),
      index: 0,
      correctCount: 0,
      answered: false,
    };
    chipRow.hidden = true;
    filterRow.hidden = true;
    chipToggle.textContent = "収録人物の一覧を表示";
    chipToggle.setAttribute("aria-expanded", "false");
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    const { questions, index, correctCount } = quizState;
    const q = questions[index];
    quizState.answered = false;
    resultEl.innerHTML = `
      <div class="quiz-card">
        <div class="quiz-progress">問題 ${index + 1} / ${questions.length}　|　正解 ${correctCount}</div>
        <div class="quiz-question-label">この教科書の実績はだれのもの？</div>
        <p class="quiz-question">${escapeHtml(q.fig.achievement)}</p>
        <div class="quiz-options" id="quizOptions">
          ${q.options
            .map(
              (opt, i) =>
                `<button class="quiz-option" data-id="${opt.id}" data-index="${i}">${escapeHtml(opt.name)}</button>`
            )
            .join("")}
        </div>
        <div id="quizFeedback"></div>
      </div>
    `;
    document.querySelectorAll(".quiz-option").forEach((btn) => {
      btn.addEventListener("click", () => handleQuizAnswer(btn.dataset.id));
    });
  }

  function handleQuizAnswer(selectedId) {
    if (quizState.answered) return;
    quizState.answered = true;
    const { questions, index } = quizState;
    const q = questions[index];
    const isCorrect = selectedId === q.fig.id;
    if (isCorrect) quizState.correctCount++;

    document.querySelectorAll(".quiz-option").forEach((btn) => {
      btn.disabled = true;
      if (btn.dataset.id === q.fig.id) btn.classList.add("correct");
      else if (btn.dataset.id === selectedId) btn.classList.add("wrong");
    });

    const isLast = index === questions.length - 1;
    document.getElementById("quizFeedback").innerHTML = `
      <div class="quiz-feedback">
        <p>${isCorrect ? "正解！" : "不正解。"}正解は「${escapeHtml(q.fig.name)}」でした。</p>
        <p><strong>もう一つの顔：</strong>${escapeHtml(q.fig.hidden_face)}</p>
        <div class="quiz-actions">
          <button class="primary" id="quizNextBtn">${isLast ? "結果を見る" : "次の問題へ"}</button>
        </div>
      </div>
    `;
    document.getElementById("quizNextBtn").addEventListener("click", () => {
      if (isLast) {
        renderQuizResult();
      } else {
        quizState.index++;
        renderQuizQuestion();
      }
    });
  }

  function renderQuizResult() {
    const { questions, correctCount } = quizState;
    resultEl.innerHTML = `
      <div class="quiz-card quiz-result">
        <div class="quiz-question-label">クイズ結果</div>
        <div class="score">${correctCount} / ${questions.length} 問正解</div>
        <div class="quiz-actions" style="justify-content:center;">
          <button class="primary" id="quizRetryBtn">もう一度挑戦する</button>
          <button id="quizExitBtn">検索に戻る</button>
        </div>
      </div>
    `;
    document.getElementById("quizRetryBtn").addEventListener("click", startQuiz);
    document.getElementById("quizExitBtn").addEventListener("click", () => {
      quizState = null;
      renderIntro();
    });
  }

  quizStartBtn.addEventListener("click", startQuiz);

  // 初期表示（プルタルの説明）
  renderIntro();
})();
</script>
</body>
</html>
